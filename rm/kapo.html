<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kapo RM</title>
<style>
  body {
    margin: 0;
    background: #ddd;
    font-family: Arial, sans-serif;
  }

  #telemovel {
    width: 360px;
    margin: 30px auto;
    padding: 70px 18px;
    background: #111;
    border-radius: 50px;
  }

  #ecra {
    position: relative;
    width: 360px;
    height: 640px;
    background: #000;
    overflow: hidden;
  }

  /* o anuncio tem 640x960, encolho para caber no telemovel */
  #anuncio {
    position: absolute;
    top: 49px;
    left: 0;
    width: 640px;
    height: 960px;
    transform: scale(0.5625);
    transform-origin: 0 0;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }

  #anuncio img {
    position: absolute;
    pointer-events: none;
  }

  #quadro {
    position: absolute;
    top: 0;
    left: 0;
    transition: opacity 0.5s;
  }

  #mao {
    animation: dica 1.6s ease-in-out infinite;
  }

  @keyframes dica {
    0%, 100% { transform: translateX(-110px); }
    50% { transform: translateX(110px); }
  }

  #botao {
    position: absolute;
    left: 110px;
    top: 842px;
    width: 420px;
    height: 78px;
    border-radius: 40px;
    display: none;
  }

  #fechar {
    position: absolute;
    left: 588px;
    top: 14px;
    width: 36px;
    height: 36px;
    cursor: pointer;
    z-index: 10;
  }

  .salta {
    animation: salto 0.45s ease-out both;
  }

  @keyframes salto {
    0%, 100% { transform: translateY(0); }
    45% { transform: translateY(-26px); }
  }

  .pulsa {
    animation: pulso 1.2s ease-in-out 0.9s infinite;
  }

  @keyframes pulso {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  #fechado {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    color: #999;
    font-size: 14px;
    text-align: center;
    padding-top: 300px;
    box-sizing: border-box;
    cursor: pointer;
  }
</style>
</head>

  function comecar() {
    revelado = false;
    apagados = [];
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(imgQuadro, 0, 0, 640, 960);
    quadro.style.display = 'block';
    quadro.style.opacity = 1;
    mao.style.display = 'block';
    document.getElementById('botao').style.display = 'none';
    document.getElementById('cta').classList.remove('pulsa');
    for (var i = 1; i <= 4; i++) {
      document.getElementById('copo' + i).classList.remove('salta');
    }
    clearTimeout(espera);
    espera = setTimeout(revelar, 8000);
  }

  imgQuadro.onload = comecar;

  function posicao(e) {
    var r = quadro.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * 640 / r.width,
      y: (e.clientY - r.top) * 960 / r.height
    };
  }

  function apagar(x, y) {
    ctx.globalCompositeOperation = 'destination-out';
    var g = ctx.createRadialGradient(x, y, raio * 0.5, x, y, raio);
    g.addColorStop(0, 'rgba(0,0,0,0.8)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x + Math.random() * 6 - 3, y + Math.random() * 6 - 3, raio, 0, Math.PI * 2);
    ctx.fill();

    var c = Math.floor(x / 20), l = Math.floor(y / 20);
    for (var a = l - 3; a <= l + 3; a++) {
      for (var b = c - 3; b <= c + 3; b++) {
        if (a >= 0 && a < linhas && b >= 0 && b < colunas) {
          apagados[a * colunas + b] = true;
        }
      }
    }
  }

  function quantoApagado() {
    var total = 0;
    for (var i = 0; i < colunas * linhas; i++) {
      if (apagados[i]) total++;
    }
    return total / (colunas * linhas);
  }

  function revelar() {
    if (revelado) return;
    revelado = true;
    clearTimeout(espera);
    mao.style.display = 'none';
    quadro.style.opacity = 0;
    setTimeout(function () { quadro.style.display = 'none'; }, 500);

    // copos saltam um de cada vez, da esquerda para a direita
    for (var i = 1; i <= 4; i++) {
      var copo = document.getElementById('copo' + i);
      copo.style.animationDelay = (0.1 + (i - 1) * 0.18) + 's';
      copo.classList.add('salta');
    }
    document.getElementById('cta').classList.add('pulsa');
    document.getElementById('botao').style.display = 'block';
  }

  quadro.addEventListener('pointerdown', function (e) {
    if (revelado) return;
    aApagar = true;
    ultimo = posicao(e);
    apagar(ultimo.x, ultimo.y);
    mao.style.display = 'none';
    clearTimeout(espera);
    quadro.setPointerCapture(e.pointerId);
  });

  quadro.addEventListener('pointermove', function (e) {
    if (!aApagar || revelado) return;
    var p = posicao(e);
    // preencher o caminho entre os dois pontos senao fica aos saltos
    var dist = Math.hypot(p.x - ultimo.x, p.y - ultimo.y);
    var passos = Math.ceil(dist / 10);
    for (var i = 1; i <= passos; i++) {
      apagar(ultimo.x + (p.x - ultimo.x) * i / passos, ultimo.y + (p.y - ultimo.y) * i / passos);
    }
    ultimo = p;
    if (quantoApagado() > 0.45) revelar();
  });

  quadro.addEventListener('pointerup', function () {
    aApagar = false;
    if (!revelado) espera = setTimeout(revelar, 8000);
  });

  document.getElementById('fechar').onclick = function () {
    anuncio.style.display = 'none';
    document.getElementById('fechado').style.display = 'block';
  };

  document.getElementById('fechado').onclick = function () {
    this.style.display = 'none';
    anuncio.style.display = 'block';
    comecar();
  };
</script>
