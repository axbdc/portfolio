<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claro RM</title>
<style>
  body {
    margin: 0;
    background: #ddd;
    font-family: Arial, sans-serif;
  }

  #telemovel {
    width: 360px;
    margin: 30px auto;
    padding: 70px 18px;
    background: #111;
    border-radius: 50px;
  }

  #ecra {
    position: relative;
    width: 360px;
    height: 640px;
    background: #000;
    overflow: hidden;
  }

  /* o anuncio tem 640x960, encolho para caber no telemovel */
  #anuncio {
    position: absolute;
    top: 49px;
    left: 0;
    width: 640px;
    height: 960px;
    transform: scale(0.5625);
    transform-origin: 0 0;
    overflow: hidden;
    user-select: none;
  }

  #anuncio img {
    position: absolute;
    pointer-events: none;
  }

  .tela {
    position: absolute;
    top: 0;
    left: 0;
    width: 640px;
    height: 960px;
  }

  /* ecra 1 */
  #ecra1 {
    cursor: pointer;
    z-index: 2;
    transition: opacity 0.3s;
  }

  #ecra1.sai {
    opacity: 0;
  }

  #cta {
    animation: pulso 1.6s ease-in-out infinite;
  }

  @keyframes pulso {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.035); }
  }

  /* ecra 2, as animacoes so arrancam quando ganha a classe "ativo" */
  #ecra2 {
    display: none;
  }

  #ecra2.ativo .anima {
    animation-duration: 0.6s;
    animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1);
    animation-fill-mode: both;
  }

  #ecra2.ativo #logo { animation-name: desce; animation-duration: 0.5s; }
  #ecra2.ativo #titulo { animation-name: sobe; animation-delay: 0.25s; }
  #ecra2.ativo #subtitulo { animation-name: sobe; animation-delay: 0.4s; }
  #ecra2.ativo #mapa { animation-name: aparece; animation-duration: 0.8s; animation-delay: 0.7s; }

  @keyframes desce {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes sobe {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes aparece {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* pins caem com um pequeno ressalto */
  #ecra2.ativo .pin {
    animation: cai 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes cai {
    0% { opacity: 0; transform: translateY(-40px); }
    1% { opacity: 1; }
    100% { opacity: 1; transform: translateY(0); }
  }

  #ecra2.ativo .nome {
    animation: entraEsq 0.4s cubic-bezier(0.33, 1, 0.68, 1) both;
  }

  @keyframes entraEsq {
    from { opacity: 0; transform: translateX(-6px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* ondas a volta de cada pin */
  .onda {
    position: absolute;
    width: 84px;
    height: 38px;
    margin: -19px 0 0 -42px;
    border: 2px solid #fff;
    border-radius: 50%;
    box-sizing: border-box;
    opacity: 0;
  }

  #ecra2.ativo .onda {
    animation: onda 1.4s linear infinite;
  }

  @keyframes onda {
    from { opacity: 0.78; transform: scale(0.19); }
    to { opacity: 0; transform: scale(1); }
  }

  /* cartoes das lojas entram da direita */
  #ecra2.ativo .loja {
    animation: entraDir 0.45s cubic-bezier(0.33, 1, 0.68, 1) both;
  }

  @keyframes entraDir {
    from { opacity: 0; transform: translateX(384px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .link {
    position: absolute;
    left: 32px;
    width: 576px;
    height: 84px;
    border-radius: 18px;
    z-index: 3;
  }

  #fechar {
    position: absolute;
    left: 588px;
    top: 14px;
    width: 36px;
    height: 36px;
    cursor: pointer;
    z-index: 10;
  }

  #fechado {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    color: #999;
    font-size: 14px;
    text-align: center;
    padding-top: 300px;
    box-sizing: border-box;
    cursor: pointer;
  }
</style>
</head>

    <div id="fechado">Anúncio fechado<br>clica para ver outra vez</div>

  </div>
</div>

<script>
  var anuncio = document.getElementById('anuncio');
  var ecra1 = document.getElementById('ecra1');
  var ecra2 = document.getElementById('ecra2');
  var espera;

  // se ninguem tocar passa sozinho para o mapa ao fim de 4s
  var tempoEcra1 = 4000;

  function comecar() {
    ecra2.classList.remove('ativo');
    ecra2.style.display = 'none';
    ecra1.classList.remove('sai');
    ecra1.style.display = 'block';
    clearTimeout(espera);
    espera = setTimeout(function () { passar('auto'); }, tempoEcra1);
  }

  function passar(como) {
    if (ecra1.style.display === 'none' || ecra1.classList.contains('sai')) return;
    clearTimeout(espera);

    // o programador pode ligar aqui as metricas, "toque" ou "auto"
    console.log('ecra 2 por ' + como);

    ecra2.style.display = 'block';
    void ecra2.offsetWidth; // para as animacoes recomecarem do zero
    ecra2.classList.add('ativo');
    ecra1.classList.add('sai');
    setTimeout(function () { ecra1.style.display = 'none'; }, 300);
  }

  // toque em qualquer sitio do ecra 1
  ecra1.addEventListener('click', function () { passar('toque'); });

  document.getElementById('fechar').onclick = function (e) {
    e.stopPropagation();
    clearTimeout(espera);
    anuncio.style.display = 'none';
    document.getElementById('fechado').style.display = 'block';
  };

  document.getElementById('fechado').onclick = function () {
    this.style.display = 'none';
    anuncio.style.display = 'block';
    comecar();
  };

  comecar();
</script>
